<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cities - Voyage Vista</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #DFF3F1;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #2D2D2D;
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 500;
    }

    .header a:hover {
      color: #FF7F50;
    }

    .separator {
      color: white;
    }

    .notepad-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 16px;
      font-weight: 500;
      border: none;
      background: none;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .notepad-btn:hover {
      color: #FF7F50;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 20px;
      color: #2D2D2D;
    }

    .scroll-box {
      max-height: 350px;
      overflow-y: auto;
      padding: 15px;
      border: 2px solid #FF7F50;
      border-radius: 10px;
      background-color: #F0FAF8;
      text-align: left;
    }

    .city-item {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      font-size: 17px;
    }

    .city-item:last-child {
      border-bottom: none;
    }

    .empty-message {
      color: #777;
      font-style: italic;
    }

    #notepad {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 250px;
      height: 200px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 10px;
      display: none;
      z-index: 1000;
    }

    #notepad textarea {
      width: 100%;
      height: 130px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 5px;
    }

    #notepad .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #888;
    }

    #notepad .close-btn:hover {
      color: red;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Home</a>
      <span class="separator">|</span>
      <a href="{{ url_for('cities') }}">Cities</a>
      <span class="separator">|</span>
      <a href="{{ url_for('countries') }}">Countries</a>
    </div>
    <button class="notepad-btn" onclick="toggleNotepad()">+ Add a Note</button>
  </div>

  <div class="container">
    <h2 class="title">Browse Cities</h2>
    <div class="scroll-box">
      {% if results %}
        {% for result in results %}
          <div class="city-item">{{ result[0] }}, {{ result[1] }}</div>
        {% endfor %}
      {% else %}
        <p class="empty-message">No cities found.</p>
      {% endif %}
    </div>
  </div>

  <div id="notepad">
    <button class="close-btn" onclick="toggleNotepad()">✖</button>
    <textarea id="noteArea" placeholder="Type your notes here..."></textarea>
  </div>

  <script>
    function toggleNotepad() {
      const pad = document.getElementById("notepad");
      pad.style.display = (pad.style.display === "block") ? "none" : "block";
    }

    const noteArea = document.getElementById("noteArea");
    noteArea.value = localStorage.getItem("userNotes") || "";
    noteArea.addEventListener("input", () => {
      localStorage.setItem("userNotes", noteArea.value);
    });
  </script>

</body>
</html>
