<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<title>Cities - Voyage Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #DFF3F1;
    margin: 0;
    padding: 0;
  }

  .header {
    background-color: #2D2D2D;
    padding: 15px;
    text-align: center;
  }

  .header a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-size: 20px;
    font-weight: 500;
  }

  .header a:hover {
    color: #FF7F50;
  }

  .separator {
    color: white;
    margin: 0 10px;
  }

  .container {
    max-width: 700px;
    margin: 50px auto;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    margin-bottom: 20px;
    color: #2D2D2D;
  }

  .scroll-box {
    max-height: 350px;
    overflow-y: auto;
    padding: 15px;
    border: 2px solid #FF7F50;
    border-radius: 10px;
    background-color: #F0FAF8;
    text-align: left;
  }

  .city-item {
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
    font-size: 17px;
  }

  .city-item:last-child {
    border-bottom: none;
  }

  .empty-message {
    color: #777;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="header">
  <a href="index.html">Home</a>
  <span class="separator">|</span>
  <a href="view_cities.html">Cities</a>
  <span class="separator">|</span>
  <a href="countries.html">Countries</a>
</div>

<div class="container">
  <h2 class="title">Browse Cities</h2>

  <div class="scroll-box">
    {% if results %}
      {% for result in results %}
        <div class="city-item">{{ result[0] }}, {{ result[1] }}</div>
      {% endfor %}
    {% else %}
      <p class="empty-message">No cities found.</p>
    {% endif %}
  </div>
</div>

</body>
</html>
